name: windows

# No Windows machine is available locally, so this is the only thing that
# verifies the Windows build: the suite on Windows, then the bundle, the
# installer, and a real-server self-test of the bundle.
#
# Everything here is a plain `uv run --no-project`, resolving the scripts'
# inline dependencies the way users do. pyproject.toml and uv.lock describe the
# local dev environment and are deliberately not used here.

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "static/**"
      - "packaging/**"
      - "launcher/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "**.py"
      - "static/**"
      - "packaging/**"
      - "launcher/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

# A newer push makes an in-flight build irrelevant.
# Neither job writes to the repository, so the default token scope is more
# than this needs.
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place to bump; both jobs must agree or the venv and the bundle drift.
  PYTHON: "3.12"
  # Everything transcribe_server.py declares inline except the CUDA wheels
  # (2 GB, and no GPU here), plus the launcher's extras and the test-only
  # packages. tests/test_project_metadata.py fails if this drifts.
  DEPS: >-
    --with pytest --with httpx2 --with fastapi --with "uvicorn[standard]"
    --with python-multipart --with faster-whisper --with numpy
    --with sherpa-onnx --with tomli --with pystray --with pillow

jobs:
  test:
    name: tests on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v10.1.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Python ${{ env.PYTHON }}
        run: uv python install ${{ env.PYTHON }}

      - name: Run the suite
        # The UI tests shell out to node, which the runner already has; they
        # skip themselves if it is missing rather than failing.
        run: |
          uv run --no-project --python ${{ env.PYTHON }} `
            ${{ env.DEPS }} pytest tests/ -q

      - name: Lint
        run: uvx ruff check . --output-format github

      - name: Type-check
        # [tool.pyright] in pyproject.toml points at .venv, which is not built
        # here, so the import resolution it does locally is not reproduced.
        run: uvx pyright
        continue-on-error: true

  build:
    name: build the launcher
    runs-on: windows-latest
    timeout-minutes: 45
    needs: test
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v10.1.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Python ${{ env.PYTHON }}
        run: uv python install ${{ env.PYTHON }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build (and build the installer)
        # Vendors uv.exe + ffmpeg, runs PyInstaller, runs the launcher's
        # self-test against the bundle, checks static/ shipped, then ISCC.
        run: |
          pwsh -File packaging/build-windows.ps1 -Installer `
            -Python ${{ env.PYTHON }}

      - name: Self-test the bundle, including a real server
        # Proves the launcher can start the server through uv and poll it, which
        # is the part a unit test cannot reach. The bundle is a windowed exe, so
        # its console output is not reliably captured: read the report it writes
        # instead of trusting an exit code.
        run: |
          $exe = "dist\TranscriptionServer\Transcription Server.exe"
          $report = Join-Path $env:LOCALAPPDATA `
            "TranscriptionServer\self-test.log"
          # Delete it first. A stale report from an earlier run reads like a
          # pass and hides the failure it was meant to explain.
          Remove-Item $report -ErrorAction SilentlyContinue

          # Start-Process -Wait, not `&`: the bundle is built console=False, so
          # it is a GUI-subsystem binary and PowerShell does not wait for those.
          # `& $exe` returned immediately, left $LASTEXITCODE stale, and made
          # the checks below meaningless.
          # --timeout 480: the probe gives up well inside this step's 15
          # minutes, so a server that never answers fails with its log printed
          # below instead of the step timing out with nothing to read.
          # The runner has no GPU, and the server refuses --device cuda without
          # one (it exits with its own "use --device cpu" advice). The launcher
          # passes inherited TRANSCRIBE_* through, so this reaches the child.
          $env:TRANSCRIBE_DEVICE = "cpu"
          # WaitForExit, not Start-Process -Wait: -Wait waits for the whole
          # process tree, so a server left behind by the launcher hung the step
          # until its timeout with nothing printed. Waiting on the launcher
          # alone lets the orphan check below catch that instead.
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--self-test", "--with-server", "--timeout", "480" `
            -PassThru
          if (-not $proc.WaitForExit(600000)) {
            Stop-Process -Id $proc.Id -Force
            throw "the launcher self-test did not exit within 10 minutes"
          }

          # The launcher must stop the server it started, grandchild included.
          $orphans = Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -like "*transcribe_server.py*" }
          if ($orphans) {
            $orphans | Select-Object ProcessId, Name, CommandLine | Format-List
            $orphans | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
            throw "the self-test left the server running after it stopped"
          }

          if (-not (Test-Path $report)) {
            throw "the self-test wrote no report; the run cannot be trusted"
          }
          Get-Content $report
          if (-not (Select-String -Path $report `
                    -Pattern "readiness probe" -Quiet)) {
            throw "the report has no readiness probe; --with-server did not run"
          }
          if ($proc.ExitCode -ne 0) {
            # The report says *that* the server did not come up; the server's
            # own output says why, and it is not in the report.
            $serverLog = Join-Path $env:LOCALAPPDATA `
              "TranscriptionServer\self-test-server.log"
            if (Test-Path $serverLog) {
              Write-Host "---- self-test-server.log (last 80 lines) ----"
              Get-Content $serverLog -Tail 80
            } else {
              Write-Host "no self-test-server.log: the server never started"
            }
            throw "bundled launcher self-test failed"
          }
        timeout-minutes: 15

      - name: Report what was produced
        run: |
          Get-ChildItem dist\TranscriptionServer | Select-Object Name, Length
          if (Test-Path packaging\output) {
            Get-ChildItem packaging\output | Select-Object Name, Length
          }

      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TranscriptionServer-windows
          path: dist/TranscriptionServer/
          retention-days: 14

      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: hashFiles('packaging/output/*.exe') != ''
        with:
          name: TranscriptionServer-installer
          path: packaging/output/*.exe
          retention-days: 14
